<!DOCTYPE html>
<html lang="es">
<head>
  <!-- Flutter reemplaza $FLUTTER_BASE_HREF por "/" en dev y build. No quitar. -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Transporte interurbano Bluefields - Managua">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Transporte Bluefields">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Transporte Bluefields</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body { margin: 0; background: #f5f7fa; }
    #loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: system-ui, sans-serif;
      color: #1565c0;
      gap: 12px;
    }
    #loading .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #bbdefb;
      border-top-color: #1565c0;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="loading">
    <div class="spinner"></div>
    <div>Cargando Transporte Bluefields…</div>
    <small>Si la pantalla queda en blanco, use F12 → Console y ejecute scripts/flutter-web.ps1</small>
  </div>
  <script src="flutter_bootstrap.js" async></script>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('loading');
      if (el) el.remove();
    });
  </script>
</body>
</html>
