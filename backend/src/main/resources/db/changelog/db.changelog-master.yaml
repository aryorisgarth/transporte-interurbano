databaseChangeLog:
  # Sesion 4 - Liquibase: esquema versionado con changelogs YAML + SQL

  - changeSet:
      id: 001-schema-consolidado
      author: transporte
      comment: Tablas, indices, constraints y vista v_cupos_viaje
      changes:
        - sqlFile:
            path: changes/001-schema-consolidado.sql
            relativeToChangelogFile: true
            splitStatements: true
            stripComments: false

