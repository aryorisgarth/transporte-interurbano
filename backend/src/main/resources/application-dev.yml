# Perfil desarrollo
#
# MySQL Docker (curso):  DB_PORT=3307  DB_PASSWORD=root   + docker compose up -d
# MySQL local (Windows):  DB_PORT=3306  DB_PASSWORD=<tu clave>
#
spring:
  datasource:
    url: jdbc:mysql://localhost:${DB_PORT:3307}/transporte_bluefields?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Managua
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  jackson:
    serialization:
      write-dates-as-timestamps: false
  security:
    oauth2:
      resourceserver:
        jwt:
          # Flutter Web usa 127.0.0.1; React usa localhost. Ver DevJwtDecoderConfig (perfil dev).
          issuer-uri: http://127.0.0.1:8180/realms/transporte-bluefields

logging:
  level:
    root: INFO
    com.bluefields.transporte: DEBUG
    org.hibernate.SQL: DEBUG
    liquibase: INFO

transporte:
  cors:
    # Flutter Web usa puerto aleatorio (ej. localhost:63263) — permitir localhost:* en dev
    allowed-origin-patterns: http://localhost:*,http://127.0.0.1:*
  security:
    enabled: true
  keycloak:
    server-url: http://127.0.0.1:8180
    realm: transporte-bluefields
    admin-realm: master
    admin-client-id: admin-cli
    admin-username: admin
    admin-password: admin
    enabled: true
  externo:
    tipo-cambio:
      url: https://api.exchangerate-api.com/v4/latest/NIO
    timeout-segundos: 5
